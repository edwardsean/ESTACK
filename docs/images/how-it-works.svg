<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1370" viewBox="0 0 1000 1370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c84343"/>
    </marker>
  </defs>
  <style>
    .t { font-size: 14px; fill: #1a202c; }
    .b { font-weight: 700; }
    .s { font-size: 12.5px; fill: #4a5568; }
    .h { font-size: 15px; font-weight: 700; }
    .l { font-size: 12px; font-weight: 700; fill: #4a5568; }
    .ln { stroke: #4a5568; stroke-width: 1.8; fill: none; }
  </style>

  <rect width="1000" height="1370" fill="#ffffff"/>

  <!-- You -->
  <rect x="300" y="20" width="400" height="52" rx="26" fill="#1a202c"/>
  <text x="500" y="44" text-anchor="middle" class="t b" fill="#ffffff" style="fill:#fff">You: /estack:poteto-mode</text>
  <text x="500" y="62" text-anchor="middle" class="s" style="fill:#cbd5e0">a goal + a check that proves it's done</text>
  <path d="M500,72 V96" class="ln" marker-end="url(#a)"/>

  <!-- Orchestrator -->
  <rect x="150" y="100" width="700" height="330" rx="14" fill="#eef4ff" stroke="#3b6fd8" stroke-width="2"/>
  <text x="500" y="127" text-anchor="middle" class="h" fill="#1e3a8a" style="fill:#1e3a8a">Orchestrator (poteto-mode): the only loop, the only owner of the plan</text>
  <g class="t">
    <rect x="200" y="145" width="600" height="44" rx="8" fill="#fff" stroke="#3b6fd8"/>
    <text x="500" y="172" text-anchor="middle">1. Restate the goal and the smallest change that meets it</text>
    <rect x="200" y="199" width="600" height="44" rx="8" fill="#fff" stroke="#3b6fd8"/>
    <text x="500" y="226" text-anchor="middle">2. Classify the task (bug, feature, migration, incident, ...)</text>
    <rect x="200" y="253" width="600" height="44" rx="8" fill="#fff" stroke="#3b6fd8"/>
    <text x="500" y="280" text-anchor="middle">3. Load only the relevant knowledge, rule cards, principles, governance</text>
    <rect x="200" y="307" width="600" height="44" rx="8" fill="#fff" stroke="#3b6fd8"/>
    <text x="500" y="334" text-anchor="middle">4. Pick a playbook (34 recipes) or a chain of them</text>
    <rect x="200" y="361" width="600" height="44" rx="8" fill="#fff" stroke="#3b6fd8"/>
    <text x="500" y="388" text-anchor="middle">5. Decide how much to delegate</text>
  </g>

  <!-- split to modes -->
  <path d="M500,430 V455 M155,455 H845" class="ln"/>
  <path d="M155,455 V476" class="ln" marker-end="url(#a)"/>
  <path d="M385,455 V476" class="ln" marker-end="url(#a)"/>
  <path d="M615,455 V476" class="ln" marker-end="url(#a)"/>
  <path d="M845,455 V476" class="ln" marker-end="url(#a)"/>

  <!-- Modes -->
  <g>
    <rect x="50" y="480" width="210" height="65" rx="10" fill="#fff7e6" stroke="#d89b2b" stroke-width="1.6"/>
    <text x="155" y="507" text-anchor="middle" class="t b">Direct or single seat</text>
    <text x="155" y="528" text-anchor="middle" class="s">simple task</text>
    <rect x="280" y="480" width="210" height="65" rx="10" fill="#fff7e6" stroke="#d89b2b" stroke-width="1.6"/>
    <text x="385" y="507" text-anchor="middle" class="t b">Sequential seats</text>
    <text x="385" y="528" text-anchor="middle" class="s">ordered steps</text>
    <rect x="510" y="480" width="210" height="65" rx="10" fill="#fff7e6" stroke="#d89b2b" stroke-width="1.6"/>
    <text x="615" y="507" text-anchor="middle" class="t b">Parallel or swarm</text>
    <text x="615" y="528" text-anchor="middle" class="s">independent pieces</text>
    <rect x="740" y="480" width="210" height="65" rx="10" fill="#fff7e6" stroke="#d89b2b" stroke-width="1.6"/>
    <text x="845" y="507" text-anchor="middle" class="t b">Arena or interrogate</text>
    <text x="845" y="528" text-anchor="middle" class="s">contested: 3 panels + a judge</text>
  </g>

  <!-- join to seats -->
  <path d="M155,545 V568 M385,545 V568 M615,545 V568 M845,545 V568 M155,568 H845" class="ln"/>
  <path d="M500,568 V586" class="ln" marker-end="url(#a)"/>

  <!-- Seats -->
  <rect x="50" y="590" width="900" height="210" rx="14" fill="#f1faf1" stroke="#3c9a4a" stroke-width="2"/>
  <text x="500" y="616" text-anchor="middle" class="h" style="fill:#1c5d27">Seats: subagents, each with its own model, effort, and tools</text>
  <rect x="70" y="630" width="420" height="155" rx="10" fill="#fff" stroke="#3c9a4a"/>
  <text x="280" y="656" text-anchor="middle" class="t b">pstack core (10 seats)</text>
  <text x="280" y="684" text-anchor="middle" class="t">architect · poteto-agent · mechanic</text>
  <text x="280" y="708" text-anchor="middle" class="t">explorer · comment-sicko</text>
  <text x="280" y="732" text-anchor="middle" class="t">panel 1 · panel 2 · panel 3 · judge</text>
  <text x="280" y="756" text-anchor="middle" class="t">verifier</text>
  <rect x="510" y="630" width="420" height="155" rx="10" fill="#fff" stroke="#3c9a4a"/>
  <text x="720" y="656" text-anchor="middle" class="t b">Enterprise (18 seats, 5 families)</text>
  <text x="530" y="680" class="s"><tspan font-weight="700" fill="#1a202c">Product:</tspan> product analyst, business analyst, PRD</text>
  <text x="530" y="701" class="s"><tspan font-weight="700" fill="#1a202c">Architecture:</tspan> system, API, database architect</text>
  <text x="530" y="722" class="s"><tspan font-weight="700" fill="#1a202c">Engineering:</tspan> backend, frontend, mobile, DB, integration</text>
  <text x="530" y="743" class="s"><tspan font-weight="700" fill="#1a202c">Quality:</tspan> QA, security, code review, performance</text>
  <text x="530" y="764" class="s"><tspan font-weight="700" fill="#1a202c">Infra:</tspan> DevOps, SRE, observability</text>

  <path d="M500,800 V836" class="ln" marker-end="url(#a)"/>

  <!-- Verify -->
  <rect x="180" y="840" width="640" height="70" rx="10" fill="#f5f0ff" stroke="#7a55c7" stroke-width="2"/>
  <text x="500" y="867" text-anchor="middle" class="t b">Verify against the real thing</text>
  <text x="500" y="890" text-anchor="middle" class="s">tests · contract · e2e · security scan · code review · independent verifier</text>

  <!-- fail loop -->
  <path d="M180,875 H25 V167 H196" stroke="#c84343" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <text transform="translate(16,520) rotate(-90)" text-anchor="middle" class="l" style="fill:#c84343">fails: back to step 1, never a blind retry</text>

  <path d="M500,910 V956" class="ln" marker-end="url(#a)"/>
  <text x="510" y="938" class="l">passes</text>

  <!-- PR -->
  <rect x="300" y="960" width="400" height="50" rx="10" fill="#fff" stroke="#4a5568" stroke-width="1.6"/>
  <text x="500" y="990" text-anchor="middle" class="t b">Open PR, babysit CI and review comments</text>
  <path d="M500,1010 V1046" class="ln" marker-end="url(#a)"/>

  <!-- Gate -->
  <polygon points="325,1050 675,1050 710,1085 675,1120 325,1120 290,1085" fill="#fdecec" stroke="#c84343" stroke-width="2"/>
  <text x="500" y="1080" text-anchor="middle" class="t b">Approval gate: push, deploy, migration</text>
  <text x="500" y="1101" text-anchor="middle" class="s">a Claude Code hook, outside the model; a human decides</text>

  <path d="M290,1085 H210 V1176" class="ln" marker-end="url(#a)"/>
  <text x="220" y="1140" class="l">human refuses</text>
  <path d="M710,1085 H750 V1176" class="ln" marker-end="url(#a)"/>
  <text x="760" y="1140" class="l">human approves</text>

  <rect x="60" y="1180" width="300" height="60" rx="10" fill="#fff" stroke="#c84343" stroke-width="1.6"/>
  <text x="210" y="1206" text-anchor="middle" class="t b">Stop and report</text>
  <text x="210" y="1226" text-anchor="middle" class="s">never rephrase to slip past the gate</text>

  <rect x="560" y="1180" width="380" height="60" rx="10" fill="#f1faf1" stroke="#3c9a4a" stroke-width="1.6"/>
  <text x="750" y="1206" text-anchor="middle" class="t b">Merge and deploy</text>
  <text x="750" y="1226" text-anchor="middle" class="s">by a human or CI/CD, never by an agent</text>

  <path d="M750,1240 V1286" class="ln" marker-end="url(#a)"/>
  <rect x="560" y="1290" width="380" height="50" rx="10" fill="#fff" stroke="#3c9a4a" stroke-width="1.6"/>
  <text x="750" y="1320" text-anchor="middle" class="t b">Production monitoring</text>
</svg>
