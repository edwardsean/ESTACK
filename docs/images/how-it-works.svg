<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1450" viewBox="0 0 1240 1450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c84343"/>
    </marker>
    <marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
  </defs>
  <style>
    .t { font-size: 14px; fill: #1a202c; }
    .b { font-weight: 700; }
    .s { font-size: 12.5px; fill: #4a5568; }
    .h { font-size: 15px; font-weight: 700; }
    .l { font-size: 12px; font-weight: 700; fill: #4a5568; }
    .ln { stroke: #4a5568; stroke-width: 1.8; fill: none; }
    .en { stroke: #0f766e; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .et { font-size: 12.5px; fill: #134e4a; }
  </style>

  <rect width="1240" height="1450" fill="#ffffff"/>

  <!-- You -->
  <rect x="300" y="20" width="400" height="52" rx="26" fill="#1a202c"/>
  <text x="500" y="44" text-anchor="middle" class="t b" style="fill:#fff">You: /estack:poteto-mode</text>
  <text x="500" y="62" text-anchor="middle" class="s" style="fill:#cbd5e0">a goal + a check that proves it's done</text>
  <path d="M500,72 V96" class="ln" marker-end="url(#a)"/>

  <!-- Orchestrator -->
  <rect x="150" y="100" width="700" height="378" rx="14" fill="#eef4ff" stroke="#3b6fd8" stroke-width="2"/>
  <text x="500" y="127" text-anchor="middle" class="h" style="fill:#1e3a8a">Orchestrator (poteto-mode): the only loop, the only owner of the plan</text>
  <g class="t">
    <rect x="200" y="145" width="600" height="44" rx="8" fill="#fff" stroke="#3b6fd8"/>
    <text x="500" y="172" text-anchor="middle">1. Restate the goal and the smallest change that meets it</text>
    <rect x="200" y="199" width="600" height="44" rx="8" fill="#fff" stroke="#3b6fd8"/>
    <text x="500" y="226" text-anchor="middle">2. Classify the task (bug, feature, migration, incident, ...)</text>
    <rect x="200" y="253" width="600" height="44" rx="8" fill="#fff" stroke="#3b6fd8"/>
    <text x="500" y="280" text-anchor="middle">3. Load only the relevant knowledge, rule cards, principles</text>
    <rect x="200" y="307" width="600" height="44" rx="8" fill="#fff" stroke="#3b6fd8"/>
    <text x="500" y="334" text-anchor="middle">4. Pick a playbook (34 recipes) or a chain of them</text>
    <rect x="200" y="361" width="600" height="44" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
    <text x="500" y="388" text-anchor="middle"><tspan class="b">5. start_task:</tspan> the engine records the task and its required steps</text>
    <rect x="200" y="415" width="600" height="44" rx="8" fill="#fff" stroke="#3b6fd8"/>
    <text x="500" y="442" text-anchor="middle">6. Decide how much to delegate</text>
  </g>

  <!-- split to modes -->
  <path d="M500,478 V500 M155,500 H845" class="ln"/>
  <path d="M155,500 V520" class="ln" marker-end="url(#a)"/>
  <path d="M385,500 V520" class="ln" marker-end="url(#a)"/>
  <path d="M615,500 V520" class="ln" marker-end="url(#a)"/>
  <path d="M845,500 V520" class="ln" marker-end="url(#a)"/>

  <g>
    <rect x="50" y="524" width="210" height="62" rx="10" fill="#fff7e6" stroke="#d89b2b" stroke-width="1.6"/>
    <text x="155" y="550" text-anchor="middle" class="t b">Direct or single seat</text>
    <text x="155" y="570" text-anchor="middle" class="s">simple task</text>
    <rect x="280" y="524" width="210" height="62" rx="10" fill="#fff7e6" stroke="#d89b2b" stroke-width="1.6"/>
    <text x="385" y="550" text-anchor="middle" class="t b">Sequential seats</text>
    <text x="385" y="570" text-anchor="middle" class="s">ordered steps</text>
    <rect x="510" y="524" width="210" height="62" rx="10" fill="#fff7e6" stroke="#d89b2b" stroke-width="1.6"/>
    <text x="615" y="550" text-anchor="middle" class="t b">Parallel or swarm</text>
    <text x="615" y="570" text-anchor="middle" class="s">independent pieces</text>
    <rect x="740" y="524" width="210" height="62" rx="10" fill="#fff7e6" stroke="#d89b2b" stroke-width="1.6"/>
    <text x="845" y="550" text-anchor="middle" class="t b">Arena or interrogate</text>
    <text x="845" y="570" text-anchor="middle" class="s">contested: 3 panels + a judge</text>
  </g>

  <path d="M155,586 V600 M385,586 V600 M615,586 V600 M845,586 V600 M155,600 H845" class="ln"/>
  <path d="M500,600 V612" class="ln" marker-end="url(#a)"/>

  <!-- Edit guard -->
  <rect x="150" y="616" width="700" height="40" rx="8" fill="#fdecec" stroke="#c84343" stroke-width="1.6"/>
  <text x="500" y="641" text-anchor="middle" class="t"><tspan class="b">Edit guard:</tspan> no open task, no code edit · .env, policy and .git are protected</text>
  <path d="M500,656 V670" class="ln" marker-end="url(#a)"/>

  <!-- Seats -->
  <rect x="50" y="674" width="900" height="200" rx="14" fill="#f1faf1" stroke="#3c9a4a" stroke-width="2"/>
  <text x="500" y="700" text-anchor="middle" class="h" style="fill:#1c5d27">Seats: subagents, each with its own model, effort, and tools</text>
  <rect x="70" y="714" width="420" height="145" rx="10" fill="#fff" stroke="#3c9a4a"/>
  <text x="280" y="740" text-anchor="middle" class="t b">core (10 seats)</text>
  <text x="280" y="766" text-anchor="middle" class="t">architect · poteto-agent · mechanic</text>
  <text x="280" y="790" text-anchor="middle" class="t">explorer · comment-sicko</text>
  <text x="280" y="814" text-anchor="middle" class="t">panel 1 · panel 2 · panel 3 · judge</text>
  <text x="280" y="838" text-anchor="middle" class="t">verifier</text>
  <rect x="510" y="714" width="420" height="145" rx="10" fill="#fff" stroke="#3c9a4a"/>
  <text x="720" y="740" text-anchor="middle" class="t b">Enterprise (18 seats, 5 families)</text>
  <text x="530" y="764" class="s"><tspan font-weight="700" fill="#1a202c">Product:</tspan> product analyst, business analyst, PRD</text>
  <text x="530" y="785" class="s"><tspan font-weight="700" fill="#1a202c">Architecture:</tspan> system, API, database architect</text>
  <text x="530" y="806" class="s"><tspan font-weight="700" fill="#1a202c">Engineering:</tspan> backend, frontend, mobile, DB, integration</text>
  <text x="530" y="827" class="s"><tspan font-weight="700" fill="#1a202c">Quality:</tspan> QA, security, code review, performance</text>
  <text x="530" y="848" class="s"><tspan font-weight="700" fill="#1a202c">Infra:</tspan> DevOps, SRE, observability</text>

  <path d="M500,874 V906" class="ln" marker-end="url(#a)"/>

  <!-- Verify -->
  <rect x="150" y="910" width="700" height="84" rx="10" fill="#f5f0ff" stroke="#7a55c7" stroke-width="2"/>
  <text x="500" y="936" text-anchor="middle" class="t b">Prove each step, recorded by the engine</text>
  <text x="500" y="958" text-anchor="middle" class="s">commit made after the task started · engine runs test and verify itself</text>
  <text x="500" y="978" text-anchor="middle" class="s">review by a different agent than the author · can't end a turn with unrecorded commits</text>

  <!-- fail loop -->
  <path d="M150,952 H25 V167 H196" stroke="#c84343" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <text transform="translate(16,560) rotate(-90)" text-anchor="middle" class="l" style="fill:#c84343">fails: back to step 1, never a blind retry</text>

  <path d="M500,994 V1036" class="ln" marker-end="url(#a)"/>
  <text x="510" y="1020" class="l">passes</text>

  <rect x="300" y="1040" width="400" height="50" rx="10" fill="#fff" stroke="#4a5568" stroke-width="1.6"/>
  <text x="500" y="1070" text-anchor="middle" class="t b">Open PR, babysit CI and review comments</text>
  <path d="M500,1090 V1126" class="ln" marker-end="url(#a)"/>

  <!-- Push gate -->
  <polygon points="300,1130 700,1130 740,1170 700,1210 300,1210 260,1170" fill="#fdecec" stroke="#c84343" stroke-width="2"/>
  <text x="500" y="1162" text-anchor="middle" class="t b">Push gate: verify evidence + your approval</text>
  <text x="500" y="1184" text-anchor="middle" class="s">Claude Code hook and git pre-push hook · workers never push</text>

  <path d="M330,1210 V1232 H210 V1256" class="ln" marker-end="url(#a)"/>
  <text x="220" y="1250" class="l">refused</text>
  <path d="M670,1210 V1232 H750 V1256" class="ln" marker-end="url(#a)"/>
  <text x="760" y="1250" class="l">you approve</text>

  <rect x="60" y="1260" width="300" height="60" rx="10" fill="#fff" stroke="#c84343" stroke-width="1.6"/>
  <text x="210" y="1286" text-anchor="middle" class="t b">Stop and report</text>
  <text x="210" y="1306" text-anchor="middle" class="s">never route around a block</text>

  <rect x="560" y="1260" width="380" height="60" rx="10" fill="#f1faf1" stroke="#3c9a4a" stroke-width="1.6"/>
  <text x="750" y="1286" text-anchor="middle" class="t b">Merge and deploy</text>
  <text x="750" y="1306" text-anchor="middle" class="s">by you or CI/CD, never by an agent</text>

  <path d="M750,1320 V1366" class="ln" marker-end="url(#a)"/>
  <rect x="560" y="1370" width="380" height="50" rx="10" fill="#fff" stroke="#3c9a4a" stroke-width="1.6"/>
  <text x="750" y="1400" text-anchor="middle" class="t b">Production monitoring</text>

  <!-- Engine panel -->
  <rect x="1000" y="300" width="220" height="960" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="1110" y="330" text-anchor="middle" class="h" style="fill:#134e4a">estack engine</text>
  <text x="1110" y="350" text-anchor="middle" class="s" style="fill:#0f766e">outside the model</text>
  <rect x="1018" y="366" width="184" height="150" rx="8" fill="#fff" stroke="#0f766e"/>
  <text x="1110" y="388" text-anchor="middle" class="t b">.estack/state.db</text>
  <text x="1034" y="412" class="et">· tasks</text>
  <text x="1034" y="432" class="et">· required steps</text>
  <text x="1034" y="452" class="et">· evidence per step</text>
  <text x="1034" y="472" class="et">· your approvals</text>
  <text x="1034" y="492" class="et">· event log</text>
  <rect x="1018" y="530" width="184" height="96" rx="8" fill="#fff" stroke="#0f766e"/>
  <text x="1110" y="552" text-anchor="middle" class="t b">.estack/policy.yaml</text>
  <text x="1034" y="574" class="et">what runs, asks,</text>
  <text x="1034" y="592" class="et">or is blocked; steps</text>
  <text x="1034" y="610" class="et">per task type</text>
  <text x="1110" y="660" text-anchor="middle" class="t b" style="fill:#134e4a">Hooks check it on</text>
  <text x="1034" y="684" class="et">· every code edit</text>
  <text x="1034" y="704" class="et">· every shell command</text>
  <text x="1034" y="724" class="et">· every agent commit</text>
  <text x="1034" y="744" class="et">· every push</text>
  <text x="1034" y="764" class="et">· every end of turn</text>
  <text x="1110" y="800" text-anchor="middle" class="t b" style="fill:#134e4a">Agents use</text>
  <text x="1034" y="824" class="et">start_task · status</text>
  <text x="1034" y="844" class="et">complete_step · run_check</text>
  <text x="1110" y="880" text-anchor="middle" class="t b" style="fill:#134e4a">You use</text>
  <text x="1034" y="904" class="et">estack status</text>
  <text x="1034" y="924" class="et">estack skip / cancel</text>
  <text x="1034" y="944" class="et">estack override</text>
  <text x="1034" y="964" class="et">(your terminal only)</text>

  <!-- engine connectors -->
  <path d="M800,383 H996" class="en" marker-end="url(#e)"/>
  <path d="M850,636 H996" class="en" marker-end="url(#e)"/>
  <path d="M850,952 H996" class="en" marker-end="url(#e)"/>
  <path d="M740,1170 C 860,1170 900,1170 996,1170" class="en" marker-end="url(#e)"/>
</svg>
