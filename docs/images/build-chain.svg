<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <style>
    .t { font-size: 15px; font-weight: 700; fill: #1a202c; }
    .s { font-size: 12.5px; fill: #4a5568; }
    .c { font-size: 12px; fill: #4a5568; font-family: ui-monospace, Menlo, Consolas, monospace; }
  </style>
  <rect width="1000" height="200" fill="#ffffff"/>

  <rect x="20" y="50" width="250" height="80" rx="10" fill="#fff7e6" stroke="#d89b2b" stroke-width="2"/>
  <text x="145" y="83" text-anchor="middle" class="t">core/</text>
  <text x="145" y="106" text-anchor="middle" class="s">playbooks, seats, skills, hooks: you edit this</text>

  <rect x="375" y="50" width="250" height="80" rx="10" fill="#f7fafc" stroke="#4a5568" stroke-width="1.6"/>
  <text x="500" y="83" text-anchor="middle" class="t">generator</text>
  <text x="500" y="106" text-anchor="middle" class="c">npm run build:claude</text>

  <rect x="730" y="50" width="250" height="80" rx="10" fill="#eef4ff" stroke="#3b6fd8" stroke-width="2"/>
  <text x="855" y="83" text-anchor="middle" class="t">adapters/claude-code/</text>
  <text x="855" y="106" text-anchor="middle" class="s">the plugin you install, never hand-edited</text>

  <path d="M270,90 H371" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M625,90 H726" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="500" y="168" text-anchor="middle" class="s">Later adapters (Cursor, OpenCode) come from the same core/ with their own names and paths.</text>
</svg>
