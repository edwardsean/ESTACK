  </defs>
  <style>
    .t { font-size: 15px; font-weight: 700; fill: #1a202c; }
    .s { font-size: 12.5px; fill: #4a5568; }
    .c { font-size: 12px; fill: #4a5568; font-family: ui-monospace, Menlo, Consolas, monospace; }
