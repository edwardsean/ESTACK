  <path d="M250,75 H381" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="317" y="132" text-anchor="middle" class="c">port-from-upstream.py</text>
  <path d="M615,75 H746" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
